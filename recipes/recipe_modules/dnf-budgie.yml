type: dnf
repos:
  copr:
    - sunwire/envycontrol
  nonfree: rpmfusion

group-install:
  with-optional: true
  packages:
    - budgie-desktop

install:
  packages:
    # Desktop Environment
    # - greetd
    - tuigreet # Console greeter for greetd, more options

    # Terminal 
    - zsh
    - terminus-fonts-console
    - alacritty
    - stow
    # - tmux

    # Text editors
    - vim-enhanced
    # - neovim

    # System tools
    - python3-envycontrol # Require enabling copr: sunwire/envycontrol
    - powertop
    - btop

    # Input methods
    - fcitx5-chewing
    - kcm-fcitx5

remove:
  auto-remove: true
  packages:
    - nvtop

replace:
  - packages:
    - old: lightdm
        new: greetd
        allow-erasing: true
