    # Text editors
    - vim-enhanced
    # - neovim

    # System tools
    - python3-envycontrol # Require enabling copr: sunwire/envycontrol
    - powertop
    - btop

    # Input methods
    - fcitx5-chewing
    - kcm-fcitx5

